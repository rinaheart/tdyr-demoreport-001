<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TdyReport Viewer Pro Max</title>
    
    <!-- Design System Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* System Tokens */
            --primary: #2f81f7;
            --primary-hover: #4791ff;
            --bg: #0d1117;
            --surface: #161b22;
            --surface-elevated: #21262d;
            --border: rgba(240, 246, 252, 0.1);
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --text-heading: #ffffff;
            --glass: rgba(13, 17, 23, 0.85);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.6);
            --radius-lg: 16px;
            --radius-md: 8px;
            --nav-h: 64px;
            --toc-w: 280px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --surface-elevated: #f0f2f5;
            --border: rgba(31, 35, 40, 0.12);
            --text-main: #24292f;
            --text-muted: #6e7781;
            --text-heading: #1f2328;
            --glass: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 1px 2px rgba(27, 31, 35, 0.04);
            --shadow-md: 0 8px 24px rgba(149, 157, 165, 0.12);
            --shadow-lg: 0 12px 48px rgba(140, 149, 159, 0.2);
            --primary: #0969da;
            --primary-hover: #0a75f0;
        }

        /* --- Base Setup --- */
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s var(--transition);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

        /* --- Navbar --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-h);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            box-sizing: border-box;
            gap: 12px;
        }

        .toggle-toc-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }
        .toggle-toc-btn:hover { background: var(--surface-elevated); color: var(--primary); }

        .brand-zone { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-box {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary), #bc8cff);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(47, 129, 247, 0.2);
        }
        .brand-name { font-weight: 700; font-size: 1.05rem; color: var(--text-heading); letter-spacing: -0.02em; }

        /* --- Progress Bar --- */
        .reading-progress-container { position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: transparent; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s; box-shadow: 0 0 8px var(--primary); }

        /* --- Actions --- */
        .actions-group { display: flex; gap: 6px; margin-left: auto; }
        .icon-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--border); background: var(--surface-elevated);
            color: var(--text-main); cursor: pointer; transition: var(--transition);
        }
        .icon-btn:hover { background: var(--surface); border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
        .icon-btn.primary { background: var(--primary); color: white; border: none; }

        /* --- Layout Core --- */
        .main-wrapper {
            display: flex;
            margin-top: var(--nav-h);
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            transition: var(--transition);
        }

        /* --- TOC Sidebar --- */
        .toc-aside {
            width: var(--toc-w);
            position: sticky;
            top: var(--nav-h);
            height: calc(100vh - var(--nav-h));
            padding: 1.5rem;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            transition: var(--transition);
            background: var(--bg);
            z-index: 900;
        }

        body.toc-collapsed .toc-aside { margin-left: calc(-1 * var(--toc-w)); opacity: 0; visibility: hidden; }

        .toc-title {
            font-size: 0.7rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.1em;
            margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px;
        }

        #toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-link {
            display: block; padding: 8px 12px; font-size: 0.85rem; color: var(--text-muted);
            text-decoration: none; border-radius: 6px; transition: var(--transition);
            border-left: 2px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .toc-link:hover { color: var(--primary); background: var(--surface-elevated); }
        .toc-link.active { color: var(--primary); background: rgba(47, 129, 247, 0.1); border-left-color: var(--primary); font-weight: 600; }
        .toc-link.h2 { padding-left: 12px; }
        .toc-link.h3 { padding-left: 24px; font-size: 0.8rem; }

        /* --- Content --- */
        .content-area {
            flex: 1;
            padding: 2rem;
            transition: var(--transition);
            display: flex;
            justify-content: center;
        }

        .report-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3.5rem;
            box-shadow: var(--shadow-md);
            max-width: 860px;
            width: 100%;
            animation: fadeIn 0.6s ease forwards;
        }

        /* --- Markdown Pro --- */
        .markdown-body {
            background: transparent !important;
            color: var(--text-main) !important;
            font-family: 'Inter', sans-serif !important;
            line-height: 1.8 !important;
            font-size: 1.05rem;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--text-heading) !important; border-bottom: 1px solid var(--border) !important;
            margin-top: 2.5rem !important; margin-bottom: 1.2rem !important; font-weight: 700 !important;
        }
        .markdown-body table { display: block; width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin: 2rem 0; }
        .markdown-body th { background: var(--surface-elevated) !important; }
        .markdown-body td, .markdown-body th { border: 1px solid var(--border) !important; padding: 12px 16px !important; }

        /* --- Mobile / Small Screen --- */
        @media (max-width: 1100px) {
            .toc-aside { position: fixed; left: 0; background: var(--surface); border-right: 1px solid var(--border); box-shadow: var(--shadow-lg); }
            body:not(.toc-collapsed) .toc-aside { transform: translateX(0); }
            body.toc-collapsed .toc-aside { transform: translateX(-100%); opacity: 1; visibility: visible; }
            .navbar { padding-left: 0.5rem; }
        }

        @media (max-width: 768px) {
            .brand-name, .version-tag { display: none; }
            .content-area { padding: 0.5rem; }
            .report-card { padding: 1.5rem; border-radius: 0; border: none; box-shadow: none; }
            .actions-group { gap: 4px; }
            .icon-btn { width: 34px; height: 34px; }
        }

        /* --- System --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; transition: opacity 0.4s; }
        .spinner { width: 28px; height: 28px; border: 3px solid var(--surface-elevated); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media print { .navbar, .toc-aside, .toggle-toc-btn { display: none; } .content-area { padding: 0; margin: 0; width: 100%; } .report-card { border: none; box-shadow: none; padding: 0; width: 100%; max-width: none; } body { background: white; } }
    </style>
</head>
<body class="dark-mode">

    <div id="loader"><div class="spinner"></div></div>

    <div class="app-shell">
        <header class="navbar">
            <button class="toggle-toc-btn" onclick="toggleTOC()" id="main-toggle">
                <i data-lucide="menu"></i>
            </button>

            <div class="brand-zone" onclick="location.reload()">
                <div class="logo-box"><i data-lucide="file-text" size="16"></i></div>
                <span class="brand-name">TdyReport</span>
                <span class="version-tag">v1.0</span>
            </div>

            <div class="actions-group">
                <select id="file-selector" onchange="changeFile(this.value)" style="background:var(--surface-elevated); color:var(--text-main); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.8rem; outline:none; max-width:120px;">
                    <option value="report.md">report.md</option>
                    <option value="reports/report.md">reports/report.md</option>
                    <option value="reports/IMRAD_draft_v1.md">IMRAD_draft_v1.md</option>
                    <option value="custom">Load khác...</option>
                </select>

                <button class="icon-btn" onclick="toggleTheme()" title="Đổi màu nền">
                    <i data-lucide="sun" id="sun-icon"></i>
                    <i data-lucide="moon" id="moon-icon" style="display:none"></i>
                </button>
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Tải file">
                    <i data-lucide="upload-cloud"></i>
                </button>
                <button class="icon-btn" onclick="window.print()" title="In PDF">
                    <i data-lucide="printer"></i>
                </button>
                <button class="icon-btn primary" onclick="copyContent()" title="Copy Markdown">
                    <i data-lucide="copy"></i>
                </button>
            </div>

            <div class="reading-progress-container"><div id="progress-bar"></div></div>
        </header>

        <div class="main-wrapper">
            <aside class="toc-aside">
                <div class="toc-title"><i data-lucide="list" size="14"></i> Mục lục</div>
                <nav id="toc-list"></nav>
            </aside>

            <main class="content-area">
                <div class="report-card">
                    <article id="content" class="markdown-body"></article>
                </div>
            </main>
        </div>
    </div>

    <input type="file" id="file-input" style="display:none" accept=".md,.markdown,.txt" onchange="handleFileUpload(event)">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>

    <script>
        lucide.createIcons();
        const contentDiv = document.getElementById('content');
        const progressBar = document.getElementById('progress-bar');
        const tocList = document.getElementById('toc-list');
        const fileSelector = document.getElementById('file-selector');

        // --- TOC Toggle ---
        function toggleTOC() {
            const isCollapsed = document.body.classList.toggle('toc-collapsed');
            localStorage.setItem('tocCollapsed', isCollapsed);
            updateToggleIcon();
        }

        function updateToggleIcon() {
            const isCollapsed = document.body.classList.contains('toc-collapsed');
            const icon = isCollapsed ? 'menu' : 'x';
            document.getElementById('main-toggle').innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        }

        // --- Theme ---
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcons();
        }
        function updateThemeIcons() {
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('sun-icon').style.display = isLight ? 'none' : 'block';
            document.getElementById('moon-icon').style.display = isLight ? 'block' : 'none';
        }

        // --- Core ---
        async function loadFile(fileName) {
            showLoader();
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error(`Không thấy: ${fileName}`);
                const md = await response.text();
                renderMarkdown(md);
                localStorage.setItem('lastFile', fileName);
            } catch (err) {
                contentDiv.innerHTML = `<div style="text-align:center; padding:40px;"><h3>Lỗi!</h3><p>${err.message}</p></div>`;
            } finally { hideLoader(); }
        }

        function renderMarkdown(md) {
            marked.setOptions({ highlight: (c, l) => Prism.languages[l] ? Prism.highlight(c, Prism.languages[l], l) : c, breaks: true, gfm: true });
            contentDiv.innerHTML = marked.parse(md);
            Prism.highlightAll();
            generateTOC();
            window.scrollTo(0,0);
        }

        function generateTOC() {
            tocList.innerHTML = "";
            contentDiv.querySelectorAll('h1, h2, h3').forEach((h, i) => {
                const id = `h-${i}`; h.setAttribute('id', id);
                const a = document.createElement('a');
                a.href = `#${id}`; a.textContent = h.textContent; a.className = `toc-link ${h.tagName.toLowerCase()}`;
                a.onclick = (e) => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); if(window.innerWidth < 1100) toggleTOC(); };
                const li = document.createElement('li'); li.appendChild(a); tocList.appendChild(li);
            });
        }

        window.onscroll = () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            progressBar.style.width = (winScroll / height) * 100 + "%";
            
            let cur = "";
            contentDiv.querySelectorAll('h1, h2, h3').forEach(h => { if(winScroll >= h.offsetTop - 120) cur = h.id; });
            document.querySelectorAll('.toc-link').forEach(l => l.classList.toggle('active', l.getAttribute('href') === `#${cur}`));
        };

        // --- Utils ---
        function changeFile(v) { if(v==='custom'){const c=prompt("Đường dẫn:"); if(c)loadFile(c);} else loadFile(v); }
        function handleFileUpload(e) { const f=e.target.files[0]; if(!f)return; showLoader(); const r=new FileReader(); r.onload=(ev)=>{renderMarkdown(ev.target.result); hideLoader();}; r.readAsText(f); }
        async function copyContent() { await navigator.clipboard.writeText(contentDiv.innerText); alert('Đã copy!'); }
        function showLoader() { document.getElementById('loader').style.display='flex'; document.getElementById('loader').style.opacity='1'; }
        function hideLoader() { const l=document.getElementById('loader'); l.style.opacity='0'; setTimeout(()=>l.style.display='none',400); }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
            if (localStorage.getItem('tocCollapsed') === 'true' || window.innerWidth < 1100) document.body.classList.add('toc-collapsed');
            updateThemeIcons(); updateToggleIcon();
            const last = localStorage.getItem('lastFile') || 'report.md';
            fileSelector.value = last; loadFile(last);
        });
    </script>
</body>
</html>

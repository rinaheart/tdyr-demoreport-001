<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Previewer - GAntigravity</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    
    <!-- Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --accent-color: #2f81f7;
            --text-main: #c9d1d9;
            --glass-bg: rgba(22, 27, 34, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 1000;
            justify-content: space-between;
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .file-info {
            font-size: 0.85rem;
            color: #8b949e;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        /* Main Content */
        .container {
            margin-top: 80px;
            margin-left: auto;
            margin-right: auto;
            max-width: 900px;
            width: 95%;
            padding: 2rem;
            background: var(--sidebar-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 50px;
            min-height: 400px;
        }

        .markdown-body {
            background: transparent !important;
            color: var(--text-main) !important;
            font-family: 'Inter', sans-serif !important;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            border-bottom-color: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error state */
        .error-box {
            padding: 2rem;
            text-align: center;
            color: #f85149;
            border: 1px dashed #f85149;
            border-radius: 8px;
            background: rgba(248, 81, 73, 0.1);
        }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="brand">
            <span>⚡</span>
            <span>MD Preview Pro</span>
        </div>
        <div id="current-file" class="file-info">Loading...</div>
        <div class="actions">
            <button class="btn" onclick="window.print()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
                In báo cáo
            </button>
            <button class="btn" onclick="copyContent()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy Markdown
            </button>
        </div>
    </nav>

    <main class="container">
        <article id="content" class="markdown-body">
            <!-- Content will be injected here -->
        </article>
    </main>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>

    <script>
        let rawMarkdown = "";

        async function loadMarkdown() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file') || 'report.md';
            const fileInfo = document.getElementById('current-file');
            const contentDiv = document.getElementById('content');
            
            fileInfo.textContent = `Source: ${fileName}`;

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error(`Could not load ${fileName}`);
                
                rawMarkdown = await response.text();
                
                // Set options for marked
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });

                contentDiv.innerHTML = marked.parse(rawMarkdown);
            } catch (err) {
                contentDiv.innerHTML = `
                    <div class="error-box">
                        <h3>Lỗi tải nội dung</h3>
                        <p>${err.message}</p>
                        <p>Hãy đảm bảo file <strong>${fileName}</strong> tồn tại trong cùng thư mục với draft.html</p>
                    </div>
                `;
            } finally {
                hideLoader();
            }
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        async function copyContent() {
            if (!rawMarkdown) return;
            try {
                await navigator.clipboard.writeText(rawMarkdown);
                alert('Đã copy Markdown vào bộ nhớ tạm!');
            } catch (err) {
                console.error('Lỗi khi copy:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadMarkdown);
    </script>
</body>
</html>

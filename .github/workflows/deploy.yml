name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Keep this to ensure we use Node 24 even if actions haven't fully migrated
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Pages
        uses: actions/configure-pages@main

      - name: Generate Reports Manifest
        run: |
          node -e "
          const fs = require('fs');
          const reports = [];
          if (fs.existsSync('reports')) {
            fs.readdirSync('reports').forEach(file => {
              if (file.endsWith('.md')) {
                reports.push('reports/' + file);
              }
            });
          }
          // Prioritize report.md to be first
          reports.sort((a, b) => {
            if (a === 'reports/report.md') return -1;
            if (b === 'reports/report.md') return 1;
            return a.localeCompare(b);
          });
          fs.writeFileSync('reports.json', JSON.stringify(reports, null, 2));
          console.log('Manifest generated with priority:', reports);
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main